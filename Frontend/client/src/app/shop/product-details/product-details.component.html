<div class="container py-5" *ngIf="product">
  <div class="row g-5">

   <!-- Images Section -->
    <div class="col-md-6">

      <!-- Main Image -->
      <div class="border rounded mb-3 text-center">
        <img
          [src]="selectedImage"
          class="img-fluid product-main-image"
          (error)="handleImageError($event)"
          alt="product image">
      </div>

      <!-- Thumbnails -->
      <div class="d-flex gap-2 justify-content-center">

        <img
          *ngFor="let img of product.productImages"
          [src]="img"
          class="img-thumbnail thumb-image"
          [class.active]="img === selectedImage"
          (click)="changeImage(img)"
          (error)="handleImageError($event)">
      </div>
    </div>

    <!-- Details -->
    <div class="col-md-6">
      <span class="badge bg-light text-dark border mb-2">
        {{product.category}}
      </span>

      <h2 class="fw-bold">{{product.name}}</h2>

      <p class="text-muted mb-3">{{product.description}}</p>

      <h3 class="text-primary fw-bold mb-3">
        {{product.price | currency}}
      </h3>

      <span class="badge"
            [ngClass]="product.quantity > 0 ? 'bg-success' : 'bg-danger'">
        {{product.quantity > 0 ? 'In Stock' : 'Out of Stock'}}
      </span>

      <hr>

      <div class="d-flex gap-3 mt-4">
        <button class="btn btn-primary px-4"
                [disabled]="product.quantity === 0"
                (click)="addToCart()">
          <i class="fa-solid fa-cart-plus me-2"></i>
          Add to Cart
        </button>

        <button class="btn btn-outline-secondary"
                (click)="toggleWishlist()">
          <i class="fa-solid fa-heart"></i>
        </button>

        <button class="btn btn-outline-secondary"
                (click)="compareProduct()">
          <i class="fa-solid fa-right-left"></i>
        </button>
      </div>
    </div>

  </div>
</div>
