<div class="card product-card h-100 shadow-sm border-0 hover-lift">
  <!-- Product Image with badges -->
  <div class="position-relative overflow-hidden">
    <img #iconRef
        [src]="product.imageUrl" 
         [alt]="product.name"
         class="card-img-top product-image"
         (error)="iconRef.src ='assets/images/placeholder.png'"
         >

    <!-- Sale Badge -->
    <!--
    <span *ngIf="product.discountPercent && product.discountPercent > 0" 
          class="position-absolute top-0 start-0 m-2 badge bg-danger rounded-pill">
      SALE {{product.discountPercent}}%
    </span>
    -->

    <!-- Out of Stock Overlay -->
    <div *ngIf="product.countInStock === 0" 
         class="position-absolute top-0 bottom-0 start-0 end-0 bg-dark bg-opacity-50 d-flex align-items-center justify-content-center">
      <span class="text-white fw-bold">OUT OF STOCK</span>
    </div>

    <!-- Quick actions overlay -->
    <div class="product-actions position-absolute top-0 end-0 p-2 d-flex flex-column gap-2">
      <button class="btn btn-light btn-sm rounded-circle shadow-sm"
              (click)="toggleWishlist()"
              [class.text-danger]="product.isInWishlist"
              title="Add to wishlist">
        <!-- <i class="bi" [class.bi-heart]="!product.isInWishlist" [class.bi-heart-fill]="product.isInWishlist"></i> -->
        <i class="fa-regular fa-heart" *ngIf="!product.isInWishlist"></i>
        <i class="fa-solid fa-heart" *ngIf="product.isInWishlist"></i>

      </button>
      <button class="btn btn-light btn-sm rounded-circle shadow-sm"
              routerLink="/shop/{{product.id}}"
              (click)="quickView()"
              title="Quick view">
        <i class="fa-regular fa-eye"></i>
      </button>
    </div>
  </div>

  <!-- Card Body -->
  <div class="card-body d-flex flex-column pt-3">
    <!-- Category -->
    <div class="mb-1">
      <span class="badge bg-light text-dark border">{{product.category}}</span>
    </div>

    <!-- Product Name -->
    <h5 class="card-title product-title mb-2">
      <a routerLink="/shop/{{product.id}}"
         class="text-decoration-none text-dark hover-primary">
        {{product.name}}
      </a>
    </h5>

    <!-- Description (truncated) -->
    <p class="card-text text-secondary small mb-3 flex-grow-1" 
       [title]="product.description">
      {{product.description | slice:0:80}}{{product.description.length > 80 ? '...' : ''}}
    </p>

    <!-- Rating -->
    <!--
    <div class="mb-3">
      <div class="d-flex align-items-center">
        <div class="rating-stars">
          <i *ngFor="let star of [1,2,3,4,5]" 
             class="bi"
             [class.bi-star-fill]="star <= (product.rating || 0)"
             [class.bi-star]="star > (product.rating || 0)"
             [class.text-warning]="star <= (product.rating || 0)"
             [class.text-secondary]="star > (product.rating || 0)">
          </i>
          replace above icon to be below icon
          <i class="fa-solid fa-star"></i>

        </div>
        <small class="text-muted ms-2">({{product.reviewCount || 0}})</small>
      </div>
    </div>
    -->

    <!-- Price -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <span class="h5 fw-bold text-primary">{{product.price | currency}}</span>
        <!--
        <span *ngIf="product.productImages?.length && product.originalPrice" 
              class="text-muted text-decoration-line-through ms-2">
          {{product.originalPrice | currency}}
        </span>
        -->
      </div>
      <span *ngIf="product.countInStock > 0" 
            class="badge bg-success bg-opacity-10 text-success border border-success">
        In Stock
      </span>
    </div>

    <!-- Action Buttons -->
  <!-- Action Buttons -->
<div class="d-flex gap-2 mt-auto">
  <!-- Add to Cart Button -->
  <button class="btn btn-primary flex-grow-1"
          (click)="addToCart()"
          [disabled]="product.countInStock === 0"
          [class.btn-success]="isInCart">
    <i class="fa-solid fa-cart-plus" *ngIf="!isInCart"></i>
    <i class="fa-solid fa-cart-shopping" *ngIf="isInCart"></i>
    {{ isInCart ? 'In Cart' : 'Add to Cart' }}
  </button>

  <!-- Remove from Cart Button -->
  <button *ngIf="isInCart"
          class="btn btn-link text-danger p-0"
          (click)="removeFromCart()"
          title="Remove item">
    <i class="fas fa-trash-alt"></i>
  </button>
</div>

  </div>

  <!-- Footer -->
  <!--
  <div *ngIf="product.freeShipping" class="card-footer bg-light border-0 pt-0">
    <small class="text-success">
      <i class="bi bi-truck"></i> Free Shipping
    </small>
  </div>
  -->
</div>
