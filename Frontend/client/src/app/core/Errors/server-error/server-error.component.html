<div class="d-flex flex-column justify-content-center align-items-center vh-90 text-center bg-gradient-danger">
  <div class="container py-4 px-3">
    <!-- Error Code with subtle warning icon -->
    <div class="position-relative mb-4">
      <h1 class="display-1 fw-bold text-warning mb-2" style="font-size: 6rem;">
        500
      </h1>
      <i class="bi bi-exclamation-triangle-fill text-warning opacity-25" 
         style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; z-index: -1;"></i>
    </div>
    
    <!-- Error title -->
    <h2 class="h2 fw-semibold text-dark mb-3">Internal Server Error</h2>
    
    <!-- Error description -->
    <p class="text-muted mb-4 max-w-md mx-auto">
      We apologize for the inconvenience. Our server encountered an unexpected 
      condition that prevented it from fulfilling your request.
    </p>
    
    <!-- Action buttons -->
    <div class="d-flex flex-wrap gap-3 justify-content-center mb-4">
      <button class="btn btn-warning px-4" (click)="reloadPage()">
        <i class="bi bi-arrow-clockwise me-2"></i>Retry Request
      </button>
      <a routerLink="/" class="btn btn-outline-dark px-4">
        <i class="bi bi-house-door me-2"></i>Return to Home
      </a>
    </div>
    
    <!-- Additional information -->
    <div class="mt-4 pt-3 border-top border-light">
      <p class="text-muted small mb-2">
        If the problem persists, please try again in a few minutes.
      </p>
      <div class="d-flex gap-3 justify-content-center small">
        <a routerLink="/support" class="text-decoration-none text-dark">
          <i class="bi bi-headset me-1"></i>Contact Support
        </a>
        <span class="text-muted">•</span>
        <a href="mailto:support@example.com" class="text-decoration-none text-dark">
          <i class="bi bi-envelope me-1"></i>Email Us
        </a>
      </div>
    </div>
  </div>
</div>
